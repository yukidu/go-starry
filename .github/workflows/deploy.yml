name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'src/**'
      - 'worker/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/deploy-trigger'
  workflow_dispatch:

concurrency:
  group: go-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply go-starry-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://go.starry.phd/ > /tmp/go-starry-home.html
          test -s /tmp/go-starry-home.html
          grep -qi "go\.starry\.phd\|短網址\|Starry" /tmp/go-starry-home.html

      - name: Verify Starry ID central SSO routes
        run: |
          curl --silent --show-error \
            --dump-header /tmp/go-starry-starry-headers.txt \
            --output /dev/null \
            --max-time 20 \
            https://go.starry.phd/auth/starry
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/go-starry-starry-headers.txt
          grep -Eiq '^location: https://id\.starry\.phd/auth/gostarry' /tmp/go-starry-starry-headers.txt

          curl --silent --show-error \
            --dump-header /tmp/go-starry-legacy-headers.txt \
            --output /dev/null \
            --max-time 20 \
            https://go.starry.phd/auth/google
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/go-starry-legacy-headers.txt
          grep -Eiq '^location: https://id\.starry\.phd/auth/gostarry' /tmp/go-starry-legacy-headers.txt

          callback_status="$(curl --silent --show-error \
            --dump-header /tmp/go-starry-callback-headers.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 20 \
            https://go.starry.phd/auth/callback)"
          test "$callback_status" = "302"
          grep -Eiq '^location: https://go\.starry\.phd/\?starry=error' /tmp/go-starry-callback-headers.txt

          central_status="$(curl --silent --show-error \
            --dump-header /tmp/go-starry-central-headers.txt \
            --output /tmp/go-starry-central-login.html \
            --write-out '%{http_code}' \
            --max-time 20 \
            https://id.starry.phd/auth/gostarry)"

          case "$central_status" in
            200)
              test -s /tmp/go-starry-central-login.html
              grep -Eqi 'Starry|Google|登入|login' /tmp/go-starry-central-login.html
              ;;
            301|302|303|307|308)
              grep -Eiq '^location: https?://' /tmp/go-starry-central-headers.txt
              ;;
            *)
              echo "::error::Starry ID central SSO returned unexpected HTTP status: $central_status"
              exit 1
              ;;
          esac

      - name: Deployment summary
        run: |
          echo "### go-starry production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://go.starry.phd" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Home smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Starry ID central SSO verification: passed" >> "$GITHUB_STEP_SUMMARY"
