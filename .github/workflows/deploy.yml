name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'src/**'
      - 'worker/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/deploy-trigger'
  workflow_dispatch:

concurrency:
  group: go-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: go-starry-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            go-starry-npm-${{ runner.os }}-

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply go-starry-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://go.starry.phd/ > /tmp/go-starry-home.html
          test -s /tmp/go-starry-home.html
          grep -qi "go\.starry\.phd\|短網址\|Starry" /tmp/go-starry-home.html

      - name: Verify QR generator production routes
        run: |
          curl --fail --silent --show-error --max-time 20 \
            'https://go.starry.phd/app.js?v11' > /tmp/go-starry-app.js
          grep -q 'qrGenerateV11' /tmp/go-starry-app.js
          grep -q '/api/qr-generator' /tmp/go-starry-app.js

          page_result="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}|%{redirect_url}' \
            --max-time 20 \
            https://go.starry.phd/qr-generator)"
          page_status="${page_result%%|*}"
          page_redirect="${page_result#*|}"
          echo "QR generator page: HTTP $page_status -> $page_redirect"
          test "$page_status" = "302" || { echo "::error::QR generator page expected HTTP 302 for guest, got $page_status"; exit 1; }
          test "$page_redirect" = "https://go.starry.phd/auth/starry" || { echo "::error::QR generator page redirect mismatch: $page_redirect"; exit 1; }

          api_status="$(curl --silent --show-error \
            --output /tmp/go-starry-qr-api.json \
            --write-out '%{http_code}' \
            --max-time 20 \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"content":"Starry QR smoke test","size":512}' \
            https://go.starry.phd/api/qr-generator)"
          echo "QR generator API guest guard: HTTP $api_status"
          test "$api_status" = "401" || { echo "::error::QR generator API expected HTTP 401 for guest, got $api_status"; exit 1; }
          grep -q '請先登入' /tmp/go-starry-qr-api.json

      - name: Verify Starry ID central SSO routes
        run: |
          check_redirect() {
            name="$1"
            source_url="$2"
            expected_url="$3"
            result="$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}|%{redirect_url}' \
              --max-time 20 \
              "$source_url")"
            status="${result%%|*}"
            redirect_url="${result#*|}"
            echo "$name: HTTP $status -> $redirect_url"
            if [ "$status" != "302" ]; then
              echo "::error::$name expected HTTP 302, got $status"
              exit 1
            fi
            if [ "$redirect_url" != "$expected_url" ]; then
              echo "::error::$name expected redirect $expected_url, got $redirect_url"
              exit 1
            fi
          }

          check_redirect \
            "Go Starry Starry-ID route" \
            "https://go.starry.phd/auth/starry" \
            "https://id.starry.phd/auth/gostarry"

          check_redirect \
            "Go Starry Google account chooser route" \
            "https://go.starry.phd/auth/starry?choose=1" \
            "https://id.starry.phd/auth/gostarry?choose=1"

          check_redirect \
            "Go Starry one-tap account switch" \
            "https://go.starry.phd/auth/switch" \
            "https://id.starry.phd/auth/gostarry?choose=1"

          check_redirect \
            "Go Starry legacy Google route" \
            "https://go.starry.phd/auth/google" \
            "https://id.starry.phd/auth/gostarry"

          check_redirect \
            "Go Starry invalid callback" \
            "https://go.starry.phd/auth/callback" \
            "https://go.starry.phd/?starry=error"

          central_result="$(curl --silent --show-error \
            --output /tmp/go-starry-central-login.html \
            --write-out '%{http_code}|%{redirect_url}' \
            --max-time 20 \
            https://id.starry.phd/auth/gostarry)"
          central_status="${central_result%%|*}"
          central_redirect="${central_result#*|}"
          echo "Starry ID central entry: HTTP $central_status -> $central_redirect"

          case "$central_status" in
            200)
              test -s /tmp/go-starry-central-login.html || { echo "::error::Starry ID central SSO returned an empty 200 response"; exit 1; }
              ;;
            301|302|303|307|308)
              test -n "$central_redirect" || { echo "::error::Starry ID central SSO redirect has no Location"; exit 1; }
              ;;
            *)
              echo "::error::Starry ID central SSO returned unexpected HTTP status: $central_status"
              exit 1
              ;;
          esac

          chooser_status="$(curl --silent --show-error \
            --output /tmp/go-starry-central-chooser.html \
            --write-out '%{http_code}' \
            --max-time 20 \
            'https://id.starry.phd/auth/gostarry?choose=1')"
          echo "Starry ID Google account chooser: HTTP $chooser_status"
          test "$chooser_status" = "200" || { echo "::error::Google account chooser expected HTTP 200, got $chooser_status"; exit 1; }
          test -s /tmp/go-starry-central-chooser.html || { echo "::error::Google account chooser returned an empty page"; exit 1; }
          grep -q 'FORCE_ACCOUNT_CHOICE=true' /tmp/go-starry-central-chooser.html || { echo "::error::Central SSO did not enable forced Google account choice"; exit 1; }

      - name: Deployment summary
        run: |
          echo "### go-starry production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://go.starry.phd" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Home smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- QR generator verification: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Starry ID central SSO verification: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google account switching: passed" >> "$GITHUB_STEP_SUMMARY"
