name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'src/**'
      - 'worker/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/deploy-trigger'
  workflow_dispatch:

concurrency:
  group: go-starry-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GOOGLE_CLIENT_ID" || { echo "::error::Missing GitHub secret: GOOGLE_CLIENT_ID"; exit 1; }
          test -n "$GOOGLE_CLIENT_SECRET" || { echo "::error::Missing GitHub secret: GOOGLE_CLIENT_SECRET"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply go-starry-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Google OAuth Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production URL
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://go.starry.phd/ > /tmp/go-starry-home.html
          test -s /tmp/go-starry-home.html
          grep -qi "go\.starry\.phd\|短網址\|Starry" /tmp/go-starry-home.html

      - name: Verify Google OAuth production routes
        run: |
          curl --fail --silent --show-error \
            --dump-header /tmp/go-starry-oauth-headers.txt \
            --output /dev/null \
            --max-time 20 \
            https://go.starry.phd/auth/google
          grep -Eq '^HTTP/[^ ]+ 302' /tmp/go-starry-oauth-headers.txt
          grep -Eiq '^location: https://accounts\.google\.com/o/oauth2/v2/auth\?' /tmp/go-starry-oauth-headers.txt

          callback_status="$(curl --silent --show-error \
            --output /tmp/go-starry-oauth-callback.json \
            --write-out '%{http_code}' \
            --max-time 20 \
            https://go.starry.phd/auth/google/callback)"
          test "$callback_status" = "400"
          grep -qi 'OAuth state' /tmp/go-starry-oauth-callback.json

      - name: Deployment summary
        run: |
          echo "### go-starry production deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://go.starry.phd" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Home smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google OAuth route verification: passed" >> "$GITHUB_STEP_SUMMARY"
